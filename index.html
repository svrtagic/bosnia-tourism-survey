<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Your Visit to Bosnia and Herzegovina</title>
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#1b2a33;--mut:#5b6b73;--line:#d3dce0;--acc:#1f5f6b;--acc2:#e3f0f2;--err:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0f181d;--card:#17232a;--ink:#e8eef1;--mut:#9fb0b8;--line:#2c3d46;--acc:#6fc0cf;--acc2:#1d3640;--err:#ff8f85}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
:lang(ar) body,body:lang(ar){line-height:1.85}
main{max-width:680px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:flex-end}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.lang button{border:0;background:transparent;color:var(--ink);padding:9px 12px;font:inherit;font-size:.92rem;cursor:pointer;min-height:44px}
.lang button+button{border-inline-start:1px solid var(--line)}
.lang button[aria-pressed=true]{background:var(--acc);color:#fff}
h1{font:600 1.55rem/1.25 Georgia,"Times New Roman",serif;margin:16px 0 2px}
:lang(ar) h1,:lang(ar) h2{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",serif}
h2{font:600 1.25rem/1.3 Georgia,"Times New Roman",serif;margin:0 0 14px;outline:0}
.sub{color:var(--mut);margin:0 0 12px}
.prog{margin:8px 0 16px}.prog small{color:var(--mut);display:block;margin-bottom:6px;min-height:1.2em}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 16px 0}
.q{margin:0 0 24px;border:0;padding:0;min-width:0}
.q>legend,.q>label.t{font-weight:600;display:block;margin-bottom:10px;padding:0}
.req::after{content:" *";color:var(--err)}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;margin-bottom:8px;cursor:pointer;min-height:48px;background:var(--bg)}
.opt:has(input:checked){border-color:var(--acc);background:var(--acc2)}
.opt input{width:20px;height:20px;flex:none;accent-color:var(--acc);margin:0}
select,input[type=number],textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;min-height:48px}
.stem{font-weight:600;margin:6px 0 4px}
.li{padding:14px 0;border-top:1px solid var(--line)}.li p{margin:0 0 10px}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sc label{position:relative}.sc input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.sc span{display:flex;align-items:center;justify-content:center;min-height:48px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:600}
.sc input:checked+span{background:var(--acc);color:#fff;border-color:var(--acc)}
.ends{display:flex;justify-content:space-between;gap:8px;font-size:.78rem;color:var(--mut);margin-top:6px}
.sc input:focus-visible+span,.opt:has(input:focus-visible),button:focus-visible,select:focus-visible,textarea:focus-visible,input[type=number]:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.miss{outline:2px solid var(--err);outline-offset:6px;border-radius:8px}
.note{background:var(--acc2);border-radius:10px;padding:12px 14px;margin:14px 0}
ul.pts{padding-inline-start:20px;margin:10px 0}ul.pts li{margin:4px 0}
.msg{color:var(--err);font-weight:600;min-height:1.2em;padding-bottom:4px}
.nav{position:sticky;bottom:0;display:flex;gap:10px;background:var(--card);padding:12px 0 calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);margin-top:8px}
.btn{flex:1;padding:13px 20px;min-height:50px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--acc);flex:0 0 34%}.btn:disabled{opacity:.55}
.done{text-align:center;padding:26px 6px 34px}.done svg{width:64px;height:64px;color:var(--acc)}
.hp{position:absolute;left:-9999px}
@media(min-width:700px){body{font-size:18px}.card{padding:28px 30px 0}main{padding-top:28px}.btn{flex:0 0 auto;min-width:160px}.nav{justify-content:space-between}}
</style>
</head>

 if(!vis(q))return '';const r=q.opt?'':' req',L=t(q.l);
 if(q.ty=='sel')return `<div class="q" data-id="${q.id}"><label class="t${r}" for="${q.id}">${L}</label><select id="${q.id}" name="${q.id}"><option value="">${t(UI.sel)}</option>${q.o.map(x=>`<option value="${x[0]}" ${ans[q.id]===x[0]?'selected':''}>${t(x)}</option>`).join('')}</select></div>`;
 if(q.ty=='n')return `<div class="q" data-id="${q.id}"><label class="t${r}" for="${q.id}">${L}</label><input type="number" inputmode="numeric" min="0" max="365" id="${q.id}" name="${q.id}" value="${ans[q.id]??''}"></div>`;
 if(q.ty=='x')return `<div class="q" data-id="${q.id}"><label class="t" for="${q.id}">${L}</label><textarea rows="3" id="${q.id}" name="${q.id}">${ans[q.id]||''}</textarea></div>`;
 return `<fieldset class="q" data-id="${q.id}"><legend class="${r}">${L}</legend>${opts(q)}</fieldset>`}
function draw(){const d=document.documentElement;d.lang=LG[li];d.dir=li==1?'rtl':'ltr';$('ttl').textContent=t(UI.ttl);$('sub').textContent=t(UI.sub);document.title=t(UI.ttl);
 $('lang').innerHTML=LG.map((c,i)=>`<button type="button" aria-pressed="${i==li}" data-l="${i}" lang="${c}">${NAMES[i]}</button>`).join('');
 const n=PAGES.length,run=step>=1;$('prog').style.display=step<0?'none':'';$('stp').textContent=run?t(UI.step).replace('{0}',step).replace('{1}',n):'';$('bar').style.width=(Math.max(step,0)/n*100)+'%';let h='';
 if(step==-1)h=`<div class="done"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg><h2 tabindex="-1" id="h">${t(UI.thx)}</h2><p>${t(UI.thx2)}</p></div>`;
 else if(step==-2)h=`<div class="done"><p>${t(UI.no)}</p></div>`;
 else if(step==0)h=`<h2 tabindex="-1" id="h">${t(UI.hello)}</h2><p>${t(UI.intro)}</p><ul class="pts">${t(UI.pts).map(x=>`<li>${x}</li>`).join('')}</ul><div class="note">${t(UI.defs)}</div>`+SCR.map(renderQ).join('')+`<label class="opt" data-id="cons"><input type="checkbox" id="cons" ${ans.cons?'checked':''}><span>${t(UI.cons)}</span></label><div class="msg" id="msg" role="alert"></div><div class="nav"><button class="btn" data-go="1" type="button">${t(UI.start)}</button></div>`;
 else{const p=PAGES[step-1];h=`<h2 tabindex="-1" id="h">${t(p.t)}</h2>`+p.q.map(renderQ).join('')+`<input class="hp" tabindex="-1" autocomplete="off" name="website" aria-hidden="true"><div class="msg" id="msg" role="alert"></div><div class="nav"><button class="btn g" data-go="-1" type="button">${t(UI.back)}</button><button class="btn" data-go="1" id="nx" type="button">${t(step==n?UI.send:UI.next)}</button></div>`}
 $('card').innerHTML=h}
function collect(){document.querySelectorAll('#card input:not(.hp),#card select,#card textarea').forEach(e=>{const n=e.name||e.id;if(!n)return;
 if(e.type=='radio'){if(e.checked)ans[n]=e.closest('.sc')?+e.value:e.value}
 else if(e.type=='checkbox'){if(e.id=='cons')ans.cons=e.checked;else ans[n]=[...document.querySelectorAll(`input[type=checkbox][name="${n}"]:checked`)].map(x=>x.value).join('; ')}
 else ans[n]=e.value.trim()})}
function missing(){const ids=[];
 if(step==0){SCR.forEach(q=>{if(!ans[q.id])ids.push(q.id)});if(!ans.cons)ids.push('cons');return ids}
 PAGES[step-1].q.forEach(q=>{if(q.ty=='l'){if(REQUIRE_ALL)q.items.forEach((_,i)=>{const k=q.pre+(q.start+i);if(!ans[k])ids.push(k)})}
  else if(!q.opt&&vis(q)&&(ans[q.id]===undefined||ans[q.id]===''))ids.push(q.id)});return ids}
async function submit(){const b=$('nx');b.disabled=true;$('msg').textContent=t(UI.sending);
 if(document.querySelector('.hp').value){step=-1;draw();return}
 const row={submission_id:sid,submitted_at:new Date().toISOString(),language:LG[li],consent:'Yes',duration_sec:Math.round((Date.now()-t0)/1000),...ans};delete row.cons;if(row.B1!=='No')delete row.B2;
 try{if(!ENDPOINT.startsWith('http'))throw new Error('ENDPOINT not set');
  const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(row)});
  const x=await r.text();if(!x.startsWith('ok'))throw new Error(x.replace(/<[^>]*>/g,' ').slice(0,120));
  store.clear();step=-1;draw();scrollTo(0,0)}
 catch(e){b.disabled=false;$('msg').textContent=t(UI.err)+' ['+e.message+']'}}
function focusH(){const h=$('h');if(h)h.focus({preventScroll:true});scrollTo(0,0)}
document.addEventListener('click',e=>{const l=e.target.closest('[data-l]');if(l){collect();li=+l.dataset.l;try{localStorage.setItem('bh_lang',li)}catch(x){}store.set();draw();return}
 const g=e.target.closest('[data-go]');if(!g)return;collect();const d=+g.dataset.go;
 if(d>0){document.querySelectorAll('.miss').forEach(x=>x.classList.remove('miss'));const m=missing();
  if(m.length){m.forEach(id=>{const el=document.querySelector(`[data-id="${id}"]`);el&&el.classList.add('miss')});$('msg').textContent=t(UI.req);const f=document.querySelector(`[data-id="${m[0]}"]`);f&&f.scrollIntoView({block:'center',behavior:'smooth'});return}
  if(step==0&&(ans.S2!=='No'||ans.S3!=='Yes')){step=-2;draw();scrollTo(0,0);return}
  if(step==PAGES.length){submit();return}}
 step+=d;store.set();draw();focusH()});
document.addEventListener('change',e=>{const el=e.target;
 if(el.dataset&&el.dataset.max){const n=document.querySelectorAll(`input[name="${el.name}"]:checked`).length;if(n>+el.dataset.max){el.checked=false;$('msg').textContent=t(UI.max);return}}
 collect();store.set();const q=PAGES[step-1]&&PAGES[step-1].q.find(x=>x.dep&&x.dep[0]===el.name);if(q){const y=scrollY;draw();scrollTo(0,y)}});
const sv=store.get();li=detect();
try{const sl=localStorage.getItem('bh_lang');if(sl!==null&&!new URLSearchParams(location.search).get('lang'))li=+sl}catch(e){}
if(sv&&sv.step>=0&&sv.sid){ans=sv.ans||{};step=sv.step;sid=sv.sid;t0=sv.t0||t0}
draw();
</script>
</body>
</html>
