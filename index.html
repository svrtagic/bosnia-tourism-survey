<title>Visitor Survey – Bosnia and Herzegovina</title>
<style>
:root{--bg:#f4f7f8;--card:#fff;--ink:#1b2a33;--mut:#5b6b73;--line:#d5dde1;--acc:#1f5f6b;--acc2:#e6f0f2;--err:#a3281f}
@media(prefers-color-scheme:dark){:root{--bg:#10191e;--card:#18242b;--ink:#e8eef1;--mut:#9fb0b8;--line:#2c3d46;--acc:#6fc0cf;--acc2:#1e3640;--err:#ff8f85}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 system-ui,"Segoe UI",Tahoma,Arial,sans-serif}
main{max-width:760px;margin:0 auto;padding:16px 16px 64px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 0 4px}
h1{font:600 1.45rem/1.25 Georgia,"Times New Roman",serif;margin:12px 0 4px}
h2{font:600 1.2rem Georgia,"Times New Roman",serif;margin:0 0 12px}
.lang{display:flex;gap:6px}.lang button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:6px;font:inherit;font-size:.9rem;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--acc);color:#fff;border-color:var(--acc)}
.bar{height:6px;background:var(--line);border-radius:3px;margin:12px 0 18px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px}
.q{margin:0 0 22px;border:0;padding:0}.q>legend,.q>label.t{font-weight:600;display:block;margin-bottom:8px;padding:0}
.req::after{content:" *";color:var(--err)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:7px 4px;cursor:pointer}.opt input{margin-top:5px;accent-color:var(--acc);flex:none}
select,input[type=number],textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
.stem{font-weight:600;margin:4px 0 10px}.legend{color:var(--mut);font-size:.88rem;margin-bottom:12px}
.li{padding:12px 0;border-top:1px solid var(--line)}.li p{margin:0 0 8px}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sc label{position:relative;text-align:center}.sc input{position:absolute;opacity:0}
.sc span{display:block;padding:9px 0;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:var(--bg)}
.sc input:checked+span{background:var(--acc);color:#fff;border-color:var(--acc)}
.sc input:focus-visible+span,button:focus-visible,select:focus-visible,.opt input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.btn{padding:11px 22px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer}
.btn.g{background:transparent;color:var(--acc)}.btn:disabled{opacity:.5}
.msg{color:var(--err);margin-top:12px;min-height:1.4em}.hp{position:absolute;left:-9999px}
</style>
</head>

<main>
<header><div class="lang" id="lang" role="group" aria-label="Language"></div></header>

<div class="card" id="card"></div>
</main>

let li=0,step=0,ans={},sent=false;
const $=id=>document.getElementById(id),t=a=>a[li];
function detect(){const q=new URLSearchParams(location.search).get('lang');if(LG.includes(q))return LG.indexOf(q);
 const map={en:0,bs:1,hr:1,sr:1,ar:2,de:3};for(const l of (navigator.languages||[navigator.language||'en'])){const k=l.slice(0,2).toLowerCase();if(k in map)return map[k]}return 0}
function opts(name,list,type,id){return list.map((o,i)=>`<label class="opt"><input type="${type}" name="${name}" value="${o[0]}" ${(type=='radio'?ans[id]===o[0]:(ans[id]||'').split('; ').includes(o[0]))?'checked':''}><span>${t(o)}</span></label>`).join('')}
function renderQ(q){const[id,ty,lab,o,req]=q;const r=req===1?' req':'';
 if(ty=='l'){const pre=id,st=o?t(lab):'';let h=`<div class="stem">${t(lab)}</div>`;const start=q[4]||1;
  return h+q[3].map((it,i)=>{const k=pre+(i+start);return `<div class="li"><p>${t(it)}</p><div class="sc" role="radiogroup" aria-label="${k}">${[1,2,3,4,5].map(v=>`<label><input type="radio" name="${k}" value="${v}" ${ans[k]==v?'checked':''}><span>${v}</span></label>`).join('')}</div></div>`}).join('')}
 if(ty=='sel')return `<div class="q"><label class="t${r}" for="${id}">${t(lab)}</label><select id="${id}" name="${id}"><option value="">${t(UI.sel)}</option>${o.map(x=>`<option value="${x[0]}" ${ans[id]===x[0]?'selected':''}>${t(x)}</option>`).join('')}</select></div>`;
 if(ty=='n')return `<div class="q"><label class="t" for="${id}">${t(lab)}</label><input type="number" min="0" max="365" id="${id}" name="${id}" value="${ans[id]||''}"></div>`;
 if(ty=='x')return `<div class="q"><label class="t" for="${id}">${t(lab)}</label><textarea rows="3" id="${id}" name="${id}">${ans[id]||''}</textarea></div>`;
 return `<fieldset class="q"><legend class="${r}">${t(lab)}</legend>${opts(id,o,ty=='m'?'checkbox':'radio',id)}</fieldset>`}
function draw(){document.documentElement.lang=LG[li];document.documentElement.dir=li==2?'rtl':'ltr';$('ttl').textContent=t(UI.ttl);document.title=t(UI.ttl);
 $('lang').innerHTML=LG.map((c,i)=>`<button type="button" aria-pressed="${i==li}" data-l="${i}">${NAMES[c]}</button>`).join('');
 $('bar').style.width=(step/PAGES.length*100)+'%';let h='';
 if(step==-1)h=`<p>${t(UI.thx)}</p>`;else if(step==-2)h=`<p>${t(UI.no)}</p>`;
 else if(step==0){h=`<p>${t(UI.intro)}</p>`+SCR.map(s=>`<fieldset class="q"><legend class="req">${t(s[1])}</legend>${opts(s[0],YN,'radio',s[0])}</fieldset>`).join('')+`<label class="opt"><input type="checkbox" id="cons" ${ans.cons?'checked':''}><span>${t(UI.cons)}</span></label><div class="nav"><span></span><button class="btn" data-go="1" type="button">${t(UI.start)}</button></div>`}
 else{const p=PAGES[step-1];h=`<h2>${t(p.t)}</h2>`+p.q.map(renderQ).join('')+`<input class="hp" tabindex="-1" autocomplete="off" name="website" aria-hidden="true"><div class="nav"><button class="btn g" data-go="-1" type="button">${t(UI.back)}</button><button class="btn" data-go="1" id="nx" type="button">${t(step==PAGES.length?UI.send:UI.next)}</button></div>`}
 $('card').innerHTML=h+'<div class="msg" id="msg" role="alert"></div>'}
function collect(){document.querySelectorAll('#card input:not(.hp),#card select,#card textarea').forEach(e=>{const n=e.name||e.id;if(e.type=='radio'){if(e.checked)ans[n]=/^[A-Z]\d+$/.test(n)&&e.closest('.sc')?+e.value:e.value}else if(e.type=='checkbox'){if(e.id=='cons'){ans.cons=e.checked}else{const L=[...document.querySelectorAll(`input[name="${n}"]:checked`)].map(x=>x.value);ans[n]=L.join('; ')}}else ans[n]=e.value})}
function valid(){const m=$('msg');if(step==0){if(!(SCR.every(s=>ans[s[0]])&&ans.cons)){m.textContent=t(UI.req);return false}return true}
 const p=PAGES[step-1];for(const q of p.q){if(q[4]===1&&q[1]!='l'&&!ans[q[0]]){m.textContent=t(UI.req);return false}
  if(q[1]=='l'&&q[4]!==undefined){/* likert: no hard requirement */}
  if(q[1]=='m'&&q[4]>1&&(ans[q[0]]||'').split('; ').filter(Boolean).length>q[4]){m.textContent=t(UI.req);return false}}return true}
let sid=(window.crypto&&crypto.randomUUID)?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2);
async function submit(){const b=$('nx');b.disabled=true;$('msg').textContent=t(["Sending…","Slanje…","جارٍ الإرسال…","Wird gesendet…"]);
 if(document.querySelector('.hp').value){step=-1;draw();return}
 const row={submission_id:sid,submitted_at:new Date().toISOString(),language:LG[li],...ans};delete row.cons;
 try{if(!ENDPOINT.startsWith('http'))throw new Error('ENDPOINT not set in index.html');
  const r=await fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(row)});
  const x=await r.text();if(!x.startsWith('ok'))throw new Error(x.replace(/<[^>]*>/g,' ').slice(0,160));
  step=-1;draw();$('bar').style.width='100%'}
 catch(e){b.disabled=false;$('msg').textContent=t(UI.err)+' ['+e.message+']'}}
document.addEventListener('click',e=>{const l=e.target.closest('[data-l]');if(l){collect();li=+l.dataset.l;draw();return}
 const g=e.target.closest('[data-go]');if(!g)return;collect();const d=+g.dataset.go;
 if(d>0){if(!valid())return;if(step==0&&(ans.S1!='Yes'||ans.S2!='No'||ans.S3!='Yes')){step=-2;draw();return}if(step==PAGES.length){submit();return}}
 step+=d;draw();scrollTo(0,0)});
li=detect();draw();
</script>
