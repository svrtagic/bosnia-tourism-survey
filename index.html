<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f6b">
<meta name="referrer" content="no-referrer">
<title>Your Visit to Bosnia and Herzegovina</title>
<style>
/*
  Targeted revision of the original survey.
  Original visual design retained.
  No external scripts, fonts, analytics or persistent answer storage.
*/
:root{
  --bg:#f3f6f7;--card:#fff;--ink:#1b2a33;--mut:#5b6b73;
  --line:#d3dce0;--acc:#1f5f6b;--acc2:#e3f0f2;--err:#b3261e;
  --button-ink:#fff
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f181d;--card:#17232a;--ink:#e8eef1;--mut:#b2c1c8;
    --line:#40535d;--acc:#6fc0cf;--acc2:#1d3640;--err:#ff8f85;
    --button-ink:#10252a
  }
}
:root[data-theme="dark"]{
  --bg:#0f181d;--card:#17232a;--ink:#e8eef1;--mut:#b2c1c8;
  --line:#40535d;--acc:#6fc0cf;--acc2:#1d3640;--err:#ff8f85;
  --button-ink:#10252a
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font:17px/1.55 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif
}
:lang(ar) body,body:lang(ar){line-height:1.85}
main{max-width:680px;margin:0 auto;padding:14px 14px 40px}
.top{display:flex;justify-content:flex-end;align-items:center;gap:8px;flex-wrap:wrap}
.lang{
  display:inline-flex;border:1px solid var(--line);border-radius:10px;
  overflow:hidden;background:var(--card)
}
.lang button{
  border:0;background:transparent;color:var(--ink);padding:9px 12px;
  font:inherit;font-size:.92rem;cursor:pointer;min-height:44px
}
.lang button+button{border-inline-start:1px solid var(--line)}
.lang button[aria-pressed=true]{background:var(--acc);color:var(--button-ink)}
h1{font:600 1.55rem/1.25 Georgia,"Times New Roman",serif;margin:16px 0 2px}
:lang(ar) h1,:lang(ar) h2{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",serif}
h2{font:600 1.25rem/1.3 Georgia,"Times New Roman",serif;margin:0 0 14px}
.sub{color:var(--mut);margin:0 0 12px}
.prog{margin:8px 0 16px}
.prog small{color:var(--mut);display:block;margin-bottom:6px;min-height:1.2em}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .3s}
.card{
  background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:18px 16px 0
}
.q{margin:0 0 24px;border:0;padding:0;min-width:0}
.q>legend,.q>label.t{
  font-weight:600;display:block;margin-bottom:10px;padding:0
}
.req::after{content:" *";color:var(--err)}
.opt{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  border:1px solid var(--line);border-radius:10px;margin-bottom:8px;
  cursor:pointer;min-height:48px;background:var(--bg)
}
.opt:has(input:checked){border-color:var(--acc);background:var(--acc2)}
.opt input{width:20px;height:20px;flex:none;accent-color:var(--acc);margin:0}
select,input[type=number],textarea{
  width:100%;padding:12px;border:1px solid var(--line);
  border-radius:10px;background:var(--bg);color:var(--ink);
  font:inherit;font-size:16px;min-height:48px
}
.stem{font-weight:600;margin:6px 0 4px}
.li{padding:14px 0;border-top:1px solid var(--line)}
.li p{margin:0 0 10px}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sc label{position:relative}
.sc input{
  position:absolute;opacity:0;inset:0;width:100%;height:100%;
  margin:0;cursor:pointer
}
.sc span{
  display:flex;align-items:center;justify-content:center;
  min-height:48px;border:1px solid var(--line);border-radius:10px;
  background:var(--bg);font-weight:600
}
.sc input:checked+span{
  background:var(--acc);color:var(--button-ink);border-color:var(--acc)
}
.ends{
  display:flex;justify-content:space-between;gap:8px;
  font-size:.82rem;color:var(--mut);margin-top:6px
}
.sc input:focus-visible+span,.opt:has(input:focus-visible),
button:focus-visible,select:focus-visible,textarea:focus-visible,
input[type=number]:focus-visible,a:focus-visible{
  outline:3px solid var(--acc);outline-offset:2px
}
.miss{outline:2px solid var(--err);outline-offset:6px;border-radius:8px}
.note{background:var(--acc2);border-radius:10px;padding:12px 14px;margin:14px 0}
ul.pts{padding-inline-start:20px;margin:10px 0}
ul.pts li{margin:4px 0}
.msg{color:var(--err);font-weight:600;min-height:1.2em;padding-bottom:4px}
.nav{
  position:sticky;bottom:0;display:flex;gap:10px;
  background:var(--card);padding:12px 0 calc(12px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);margin-top:8px
}
.btn{
  flex:1;padding:13px 20px;min-height:50px;border-radius:10px;
  border:1px solid var(--acc);background:var(--acc);color:var(--button-ink);
  font:inherit;font-weight:600;cursor:pointer
}
.btn.g{background:transparent;color:var(--acc);flex:0 0 34%}
.btn:disabled{opacity:.55;cursor:wait}
.done{text-align:center;padding:26px 6px 34px}
.done svg{width:64px;height:64px;color:var(--acc)}
.hp{position:absolute;left:-9999px}
.help{font-size:.85rem;color:var(--mut);margin:6px 0 10px}
.extra{margin-top:10px}
.extra .opt{font-size:.9rem;padding:9px 12px}
.minor{
  border:1px solid var(--line);background:var(--card);
  color:var(--ink);border-radius:8px;min-height:44px;
  padding:8px 12px;font:inherit;font-size:.85rem;cursor:pointer
}
.clear{
  border:0;background:transparent;color:var(--acc);
  text-decoration:underline;min-height:44px;padding:4px 0;
  font:inherit;font-size:.85rem;cursor:pointer
}
details{margin:14px 0}
summary{cursor:pointer;font-weight:600;min-height:44px;padding:8px 0}
dl{margin:12px 0}
dt{font-weight:600;margin-top:12px}
dd{margin:4px 0 0;white-space:pre-line;overflow-wrap:anywhere}
.receipt{
  direction:ltr;display:block;overflow-wrap:anywhere;
  background:var(--bg);padding:12px;border-radius:8px;margin:12px 0
}
.footer{font-size:.82rem;color:var(--mut);margin-top:16px}
.skip{
  position:absolute;top:-100px;inset-inline-start:10px;
  background:var(--card);color:var(--acc);padding:12px;z-index:10
}
.skip:focus{top:10px}
[hidden]{display:none!important}
a{color:var(--acc)}
@media(min-width:700px){
  body{font-size:18px}.card{padding:28px 30px 0}
  main{padding-top:28px}.btn{flex:0 0 auto;min-width:160px}
  .nav{justify-content:space-between}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<a class="skip" href="#card" id="skip"></a>
<main>
  <div class="top">
    <div class="lang" id="lang" role="group" aria-label="Language"></div>
    <button class="minor" id="theme" type="button"></button>
  </div>
  <h1 id="ttl"></h1>
  <p class="sub" id="sub"></p>
  <div class="note help" id="status"></div>
  <div class="prog" id="prog">
    <small id="stp"></small>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  </div>
  <div class="card" id="card"></div>
  <div class="footer" id="footer"></div>
  <noscript>Please enable JavaScript to take this survey.</noscript>
</main>

"use strict";

/* ============================================================

   Review mode:
   - Opens the complete questionnaire.

   - Complete ALL INFO values in English, Arabic and German.
   - Confirm the three approval/testing flags.

   - Only then publish the public participant URL.

     VISIT_START: null, VISIT_END: null

     VISIT_START: "2013-01", VISIT_END: "2025-12"

   It is NOT automatically restricted to the last 12 months.

   Existing question IDs and numeric rating codes are retained.
   New fields:
     S4                     current/completed visit
     sensitive_consent      separate optional consent
     instrument_version
     notice_version
     visit_window_start
     visit_window_end

   Backend requirements:
   - Validate data and eligibility on the server.
   - Deduplicate submission_id.
   - Save before returning "ok".
   - Support NA, DK, PNTS and additional fields.

function dateIndex(value){
  if(value===null) return null;
  if(typeof value!=="string" || !/^\d{4}-(0[1-9]|1[0-2])$/.test(value)) return NaN;
  const [y,m]=value.split("-").map(Number);
  return y*12+m-1;
}
function validPeriodConfig(){
  const a=dateIndex(CONFIG.VISIT_START),b=dateIndex(CONFIG.VISIT_END);
  return (a===null||Number.isFinite(a)) &&
         (b===null||Number.isFinite(b)) &&
         (a===null||b===null||a<=b);
}
function yearOptions(){
  const now=new Date(),Y=now.getFullYear();
  const a=dateIndex(CONFIG.VISIT_START),b=dateIndex(CONFIG.VISIT_END);
  if(!validPeriodConfig()) return [N(String(Y))];
  const high=Math.min(Y,b===null?Y:Math.floor(b/12));
  const low=a===null?Math.min(high,Y-3):Math.floor(a/12);
  const rows=[];
  for(let y=high;y>=low;y--) rows.push(N(String(y)));
  if(a===null) rows.push(["Earlier","قبل ذلك","Früher"]);
  return rows;
}

/* Conservatively identified optional sensitive-response items. */
const SENSITIVE_IDS=new Set(["B5","C4","D10","D11","F3","G6"]);
const SELECTED_EU=new Set(["Austria","Germany","Italy","France","Poland"]);
const SELECTED_GCC=new Set(["Saudi Arabia","Kuwait","Qatar","United Arab Emirates"]);

function newId(){
  if(window.crypto && typeof crypto.randomUUID==="function") return crypto.randomUUID();
  if(window.crypto && typeof crypto.getRandomValues==="function"){
    const bytes=new Uint8Array(16);
    crypto.getRandomValues(bytes);
    return Array.from(bytes,b=>b.toString(16).padStart(2,"0")).join("");
  }
  return null;
}
let sid=newId();

function detect(){
  const query=new URLSearchParams(location.search).get("lang");
  if(LG.includes(query)) return LG.indexOf(query);
  for(const language of navigator.languages||[navigator.language||"en"]){
    const code=language.slice(0,2).toLowerCase();
    if(LG.includes(code)) return LG.indexOf(code);
  }
  return 0;
}
function liveReady(){
  const allInfo=Object.values(CONFIG.INFO).every(value=>
    Array.isArray(value) && value.length===3 &&
    value.every(v=>typeof v==="string" && v.trim().length>0)
  );
  return CONFIG.MODE==="live" &&
    CONFIG.ETHICS_APPROVAL_CONFIRMED===true &&
    CONFIG.PRIVACY_REVIEW_CONFIRMED===true &&
    CONFIG.BACKEND_TEST_CONFIRMED===true &&
    allInfo && validPeriodConfig() && sid!==null &&
    /^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(ENDPOINT);
}
function currentVisit(){return ans.S4==="Current visit";}
function visible(q){
  return (!q.dep || ans[q.dep[0]]===q.dep[1]) &&
         (!SENSITIVE_IDS.has(q.id) || ans.sensitive_consent===true);
}
function itemVisible(id){
  return !SENSITIVE_IDS.has(id) || ans.sensitive_consent===true;
}
function selected(name,value,type){
  return type==="radio"
    ? String(ans[name]??"")===String(value)
    : String(ans[name]||"").split("; ").includes(value);
}
function optionalClear(id){
  return `<button type="button" class="clear" data-clear="${esc(id)}">${E(UI.clear)}</button>`;
}
function optionsHTML(q){
  const type=q.ty==="m"?"checkbox":"radio";
  return q.o.map(o=>`

      <input type="${type}" name="${esc(q.id)}" value="${esc(o[0])}"
        ${q.max?`data-max="${q.max}"`:""}
        ${selected(q.id,o[0],type)?"checked":""}>
      <span>${E(o)}</span>

}
function labelFor(q){

function groupStem(q){

function renderQ(q){
  if(q.ty==="l"){
    const ends=SC[q.sc][li];
    const stem=t(groupStem(q));
    return (stem?`<div class="stem">${esc(stem)}</div>`:"")+
      `<p class="help">${E(UI.ratingHelp)}</p>`+
      q.items.map((item,i)=>{
        const id=q.pre+(q.start+i);
        if(!itemVisible(id)) return "";
        const label=statementFor(id,item);
        const scoreLabels=SCALE_LABELS[q.sc][li];
        return `
        <div class="li" data-id="${esc(id)}">
          <p id="label_${esc(id)}">${E(label)}</p>
          <div role="radiogroup" aria-labelledby="label_${esc(id)}">
            <div class="sc">
              ${[1,2,3,4,5].map(v=>`
                <label>
                  <input type="radio" name="${esc(id)}" value="${v}"
                    aria-label="${esc(v+" – "+scoreLabels[v-1])}"
                    ${String(ans[id]??"")===String(v)?"checked":""}>
                  <span>${v}</span>
                </label>`).join("")}
            </div>
            <div class="ends">
              <span>1 – ${esc(ends[0])}</span>
              <span>5 – ${esc(ends[1])}</span>
            </div>
            <div class="extra">
              ${[["NA",UI.na],["DK",UI.dk],["PNTS",UI.pnts]].map(([value,label])=>`
                <label class="opt">
                  <input type="radio" name="${esc(id)}" value="${value}"
                    ${ans[id]===value?"checked":""}>
                  <span>${E(label)}</span>
                </label>`).join("")}
            </div>
          </div>
          ${optionalClear(id)}
        </div>`;
      }).join("");
  }

  if(!visible(q)) return "";
  const required=q.opt?"":" req";
  const label=E(labelFor(q));
  const help=q.opt?`<p class="help">${E(UI.optional)}</p>`:"";
  const clear=q.opt?optionalClear(q.id):"";

  if(q.ty==="sel") return `
    <div class="q" data-id="${esc(q.id)}">
      <label class="t${required}" for="${esc(q.id)}">${label}</label>
      ${help}
      <select id="${esc(q.id)}" name="${esc(q.id)}" ${q.opt?"":'aria-required="true"'}>
        <option value="">${E(UI.sel)}</option>
        ${q.o.map(o=>`<option value="${esc(o[0])}"
          ${ans[q.id]===o[0]?"selected":""}>${E(o)}</option>`).join("")}
      </select>
      ${clear}
    </div>`;

  if(q.ty==="n") return `
    <div class="q" data-id="${esc(q.id)}">
      <label class="t${required}" for="${esc(q.id)}">${label}</label>
      ${help}
      <input type="number" inputmode="numeric" min="0" max="365" step="1"
        id="${esc(q.id)}" name="${esc(q.id)}"
        ${q.opt?"":'aria-required="true"'}
        value="${esc(ans[q.id]??"")}">
      ${clear}
    </div>`;

  if(q.ty==="x") return `
    <div class="q" data-id="${esc(q.id)}">
      <label class="t" for="${esc(q.id)}">${label}</label>
      <p class="help" id="help_${esc(q.id)}">${E(UI.textHelp)}</p>
      <textarea rows="3" maxlength="1000"
        id="${esc(q.id)}" name="${esc(q.id)}"
        aria-describedby="help_${esc(q.id)}">${esc(ans[q.id]||"")}</textarea>
      ${clear}
    </div>`;

  return `
    <fieldset class="q" data-id="${esc(q.id)}">
      <legend class="${required}">${label}</legend>
      ${help}${optionsHTML(q)}${clear}
    </fieldset>`;
}

    const p=PAGES[step-1];
    h=`
      <h2 tabindex="-1" id="h">${E(p.t)}</h2>
      ${(step===2||step===6)&&currentVisit()
        ?`<p class="note help">${E(UI.currentHelp)}</p>`:""}
      ${!ans.sensitive_consent && [2,3,4,6,7].includes(step)
        ?`<p class="help">${E(UI.sensitiveSkipped)}</p>`:""}
      ${step===2?periodHTML():""}
      ${p.q.map(renderQ).join("")}
      <input class="hp" tabindex="-1" autocomplete="off"
        name="website" aria-hidden="true">
      <div class="msg" id="msg" role="alert"></div>
      <div class="nav">
        <button class="btn g" data-go="-1" type="button">${E(UI.back)}</button>
        <button class="btn" data-go="1" id="nx" type="button">
          ${E(step===n
            ?(CONFIG.MODE==="live"?UI.send:UI.finishPreview)
            :UI.next)}
        </button>
      </div>
      <button class="clear" type="button" data-reset>${E(UI.exit)}</button>`;
  }
  $("card").innerHTML=h;
}
function collect(){
  document.querySelectorAll("#card input:not(.hp),#card select,#card textarea")
    .forEach(el=>{
      const name=el.name||el.id;
      if(!name) return;
      if(el.type==="radio"){
        if(el.checked){
          ans[name]=el.closest(".sc")?Number(el.value):el.value;
        }
      } else if(el.type==="checkbox"){
        if(name==="cons"||name==="sensitive_consent"){
          ans[name]=el.checked;
        } else {
          ans[name]=Array.from(
            document.querySelectorAll(`#card input[type="checkbox"][name="${name}"]:checked`)
          ).map(v=>v.value).join("; ");
        }
      } else {
        ans[name]=el.value.trim();
      }
    });

  if(!ans.sensitive_consent){
    SENSITIVE_IDS.forEach(id=>delete ans[id]);
  }
  if(ans.B1!=="No") delete ans.B2;
  if(ans.S3!=="Yes") delete ans.S4;
}
function missing(){
  const ids=[];
  if(step===0){
    SCR.forEach(q=>{
      if(visible(q)&&!ans[q.id]) ids.push(q.id);
    });
    if(!ans.cons) ids.push("cons");
    return ids;
  }
  PAGES[step-1].q.forEach(q=>{
    if(q.ty==="l"){
      if(REQUIRE_ALL){
        q.items.forEach((_,i)=>{
          const id=q.pre+(q.start+i);
          if(itemVisible(id)&&!ans[id]) ids.push(id);
        });
      }
    } else if(!q.opt&&visible(q)&&
      (ans[q.id]===undefined||ans[q.id]==="")){
      ids.push(q.id);
    }
  });
  return ids;
}
function mark(ids,message){
  document.querySelectorAll(".miss").forEach(el=>el.classList.remove("miss"));
  ids.forEach(id=>{
    const el=document.querySelector(`[data-id="${id}"]`);
    if(el) el.classList.add("miss");
  });
  if($("msg")) $("msg").textContent=message;
  const first=document.querySelector(`[data-id="${ids[0]}"]`);
  if(first){
    first.scrollIntoView({
      block:"center",
      behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"
    });
    const control=first.querySelector("input,select,textarea");
    if(control) control.focus({preventScroll:true});
  }
}
function dateValid(){
  if(!validPeriodConfig()) return false;
  const month=MON.findIndex(m=>m[0]===ans.B3);
  if(month<0) return false;
  if(ans.B3Y==="Earlier"){
    return CONFIG.VISIT_START===null &&
      yearOptions().some(o=>o[0]==="Earlier");
  }
  const year=Number(ans.B3Y);
  if(!Number.isInteger(year) ||
     !yearOptions().some(o=>o[0]===String(year))) return false;
  const date=year*12+month;
  const now=new Date(),current=now.getFullYear()*12+now.getMonth();
  const lower=dateIndex(CONFIG.VISIT_START),upper=dateIndex(CONFIG.VISIT_END);
  return date<=current &&
    (lower===null||date>=lower) &&
    (upper===null||date<=upper);
}
function nightsValid(){
  if(ans.B4===""||ans.B4===undefined) return false;
  const value=Number(ans.B4);
  return Number.isInteger(value)&&value>=0&&value<=365;
}
function focusH(){
  const h=$("h");
  if(h) h.focus({preventScroll:true});
  window.scrollTo(0,0);
}
function reset(){
  if(busy) return;
  if(Object.keys(ans).length || submissionAttempted || receipt){
    if(!window.confirm(t(UI.exitConfirm))) return;
  }
  ans={};step=0;t0=Date.now();sid=newId();
  pendingRow=null;receipt="";submissionAttempted=false;
  draw();focusH();
}
function setBusy(value){
  busy=value;
  document.querySelectorAll("#card button,#lang button,#theme")
    .forEach(button=>button.disabled=value);
}
function buildRow(){
  const row={
    submission_id:sid,
    submitted_at:new Date().toISOString(),
    language:LG[li],
    consent:"Yes",
    duration_sec:Math.round((Date.now()-t0)/1000),
    ...ans,
    sensitive_consent:ans.sensitive_consent?"Yes":"No",
    instrument_version:CONFIG.INSTRUMENT_VERSION,
    notice_version:CONFIG.NOTICE_VERSION,
    visit_window_start:CONFIG.VISIT_START||"",
    visit_window_end:CONFIG.VISIT_END||""
  };
  delete row.cons;
  if(row.B1!=="No") delete row.B2;
  if(!ans.sensitive_consent) SENSITIVE_IDS.forEach(id=>delete row[id]);

  /*
    Preserve original A1 country values.
    Country classification belongs in analysis/server processing:
      Selected EU: Austria, Germany, Italy, France, Poland.
      Selected GCC: Saudi Arabia, Kuwait, Qatar, UAE.
      Other responses remain supplementary, not silently discarded.
  */
  return row;
}
async function submit(){
  if(busy) return;

  if(CONFIG.MODE!=="live"){
    ans={};pendingRow=null;step=-1;draw();focusH();return;
  }
  if(!liveReady()){
    $("msg").textContent=t(UI.blocked);return;
  }
  collect();
  if(!ans.cons||ans.S2!=="No"||ans.S3!=="Yes"||
     !["Current visit","Completed visit"].includes(ans.S4)||
     !ans.A1||!dateValid()||!nightsValid()){
    $("msg").textContent=t(UI.req);return;
  }

  const trap=document.querySelector(".hp");
  if(trap&&trap.value){
    $("msg").textContent=t(UI.err);return;
  }

  /*
    Freeze a submission attempt. If acknowledgement is lost, the next
    attempt sends the same payload and submission_id, not a new ID.
    Server-side deduplication is still essential.
  */
  if(!pendingRow) pendingRow=buildRow();
  submissionAttempted=true;
  setBusy(true);
  $("msg").textContent=t(UI.sending);

  const controller=new AbortController();
  const timeout=setTimeout(()=>controller.abort(),25000);

  try{
    const response=await fetch(ENDPOINT,{
      method:"POST",
      credentials:"omit",
      redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(pendingRow),
      signal:controller.signal
    });
    if(!response.ok) throw new Error("Submission HTTP error");
    const body=(await response.text()).trim();

    /*
      Preserves the original Apps Script acknowledgement convention:
      "ok", or "ok" followed by whitespace/colon.
      The server must send this only after successful database saving.
    */
    if(!/^ok(?:$|[\s:])/i.test(body)){
      throw new Error("No valid acknowledgement");
    }

    receipt=sid;
    ans={};pendingRow=null;step=-1;
    busy=false;draw();focusH();
  } catch(error){
    setBusy(false);
    $("msg").textContent=t(UI.err);
  } finally {
    clearTimeout(timeout);
  }
}

document.addEventListener("click",event=>{
  const language=event.target.closest("[data-l]");
  if(language){
    if(busy) return;
    collect();
    li=Number(language.dataset.l);
    draw();return;
  }

  if(event.target.closest("#theme")){
    const dark=themeOverride
      ?themeOverride==="dark"
      :matchMedia("(prefers-color-scheme: dark)").matches;
    themeOverride=dark?"light":"dark";
    document.documentElement.dataset.theme=themeOverride;
    return;
  }

  if(event.target.closest("[data-reset]")){
    reset();return;
  }

  const clear=event.target.closest("[data-clear]");
  if(clear){
    if(busy||submissionAttempted) return;
    collect();
    delete ans[clear.dataset.clear];
    const y=window.scrollY;draw();window.scrollTo(0,y);
    return;
  }

  const go=event.target.closest("[data-go]");
  if(!go||busy) return;

  /*
    After an uncertain live submission, prevent changes to its payload.
    Retry sends exactly the same answers and reference.
  */
  if(submissionAttempted&&pendingRow){
    if(Number(go.dataset.go)>0) submit();
    return;
  }

  collect();
  const direction=Number(go.dataset.go);

  if(direction>0){
    const required=missing();
    if(required.length){
      mark(required,t(UI.req));return;
    }

    if(step===0&&(ans.S2!=="No"||ans.S3!=="Yes")){
      ans={};step=-2;draw();focusH();return;
    }

    if(step===2){
      if(!dateValid()){
        mark(["B3","B3Y"],t(UI.dateError));return;
      }
      if(!nightsValid()){
        mark(["B4"],t(UI.nightsError));return;
      }
    }

    if(step===PAGES.length){
      submit();return;
    }
  }

  step+=direction;
  draw();focusH();
});

document.addEventListener("input",event=>{
  if(event.target.matches("#card textarea")&&!busy&&!submissionAttempted){
    collect();
  }
});
document.addEventListener("change",event=>{
  if(busy||submissionAttempted) return;
  const el=event.target;

  if(el.dataset&&el.dataset.max){
    const count=document.querySelectorAll(
      `#card input[name="${el.name}"]:checked`
    ).length;
    if(count>Number(el.dataset.max)){
      el.checked=false;
      $("msg").textContent=t(UI.max);
      return;
    }
  }

  collect();
  const depends=(step===0?SCR:PAGES[step-1]?.q||[])
    .some(q=>q.dep&&q.dep[0]===el.name);

  if(depends || el.id==="sensitive_consent"){
    const y=window.scrollY;
    draw();window.scrollTo(0,y);
  }
});

/*
  No localStorage/sessionStorage access:
  previously saved drafts are neither loaded nor reused.
  Old drafts from the original survey may still exist in the user's
  browser until that site's storage is manually cleared.
*/
li=detect();
draw();
</script>
